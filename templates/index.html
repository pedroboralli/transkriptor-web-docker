<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Transkriptor 2.0</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="description" content="Transcreva, baixe e legende vídeos do YouTube.">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Transkriptor">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* Tabs */
        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Inputs & forms */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Buttons */
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .action-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn.secondary {
            background: var(--secondary);
        }

        .action-btn.secondary:hover {
            box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.4);
        }

        /* Results Area */
        .result-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            min-height: 150px;
            border: 1px solid var(--glass-border);
            white-space: pre-wrap;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* Grid for formats */
        .formats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        /* Sub-tabs for format types */
        .sub-tab-buttons {
            display: flex;
            gap: 8px;
            margin: 20px 0 0 0;
            background: rgba(0,0,0,0.15);
            padding: 4px;
            border-radius: 10px;
            width: fit-content;
        }

        .sub-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .sub-tab-btn:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .sub-tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 3px 8px rgba(99,102,241,0.35);
        }

        .sub-tab-btn.green.active {
            background: #10b981;
            box-shadow: 0 3px 8px rgba(16,185,129,0.35);
        }

        .format-panel {
            display: none;
        }

        .format-panel.active {
            display: block;
        }

        .format-column h3 {
            color: var(--primary);
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .format-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .format-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        #download-progress {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        #download-progress.show {
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .progress-percent {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #6366f1, #34d399);
            transition: width 0.3s ease;
        }

        .progress-bar.indeterminate {
            width: 100%;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }

        .tag {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .mp3-btn {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            margin-top: 5px;
        }

        .mp3-btn:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        /* Thumbnail */
        .thumbnail-container {
            margin-top: 30px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
        }

        #thumbnail-preview {
            width: 100%;
            display: block;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            font-weight: 600;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .loading span {
            display: none;
        }
        /* Mobile */
        @media (max-width: 640px) {
            body {
                align-items: flex-start;
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }

            .container {
                margin: 12px;
                padding: 20px 16px;
                border-radius: 18px;
            }

            header {
                margin-bottom: 24px;
            }

            h1 {
                font-size: 2.2rem;
            }

            p.subtitle {
                font-size: 1rem;
            }

            .tab-buttons {
                width: auto;
                flex-wrap: wrap;
                gap: 6px;
            }

            .tab-btn {
                padding: 8px 14px;
                font-size: 0.9rem;
            }

            .sub-tab-buttons {
                flex-wrap: wrap;
            }

            input[type="text"] {
                padding: 14px 16px;
                font-size: 16px; /* evita zoom automático no iOS */
            }

            textarea {
                font-size: 16px;
            }

            .action-btn {
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Transkriptor 2.0</h1>
            <p class="subtitle">Baixe e transcreva conteúdo do YouTube com facilidade.</p>
        </header>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('transcribe')">Transcrição</button>
            <button class="tab-btn" onclick="switchTab('download')">Download</button>
            <button class="tab-btn" onclick="switchTab('thumbnail')">Thumbnail</button>
            <button class="tab-btn" onclick="switchTab('paraphrase')">Parafraseador</button>
            <button class="tab-btn" onclick="switchTab('srt')">Gerador STR</button>
        </div>

        <!-- Transcribe Tab -->
        <div id="transcribe" class="tab-content active">
            <div class="input-group">
                <input type="text" id="transcribe-url" placeholder="Cole a URL do vídeo do YouTube aqui..."
                    autocomplete="off">
            </div>

            <button class="action-btn" onclick="transcribeVideo(this)">
                <div class="spinner"></div>
                <span>✨ Iniciar Transcrição</span>
            </button>

            <button class="action-btn secondary" style="margin-top: 12px;"
                onclick="copyTranscription()">📋 Copiar transcrição</button>

            <div id="video-title-box" style="display: none; margin-top: 25px;">
                <label for="video-title"
                    style="display: block; margin-bottom: 8px; font-size: 0.9rem; opacity: 0.7;">Título do vídeo</label>
                <div style="display: flex; gap: 10px; align-items: stretch;">
                    <input type="text" id="video-title" readonly style="flex: 1; min-width: 0;">
                    <button class="action-btn secondary" style="width: auto; padding: 0 20px; white-space: nowrap;"
                        onclick="copyTitle()">📋 Copiar título</button>
                </div>
            </div>

            <div class="result-box" id="transcription-output">Sua transcrição aparecerá aqui...</div>
        </div>

        <!-- Download Tab -->
        <div id="download" class="tab-content">
            <div class="input-group">
                <input type="text" id="download-url" placeholder="Cole a URL para baixar..." autocomplete="off">
            </div>
            <button class="action-btn" onclick="listFormats(this)">
                <div class="spinner"></div>
                <span>🔍 Buscar Formatos</span>
            </button>

            <div id="download-progress">
                <div class="progress-info">
                    <span id="progress-stage">Preparando</span>
                    <span><span id="progress-meta" style="opacity:0.6;font-size:0.85em;margin-right:8px"></span><span class="progress-percent" id="progress-percent">0%</span></span>
                </div>
                <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
            </div>
            <div id="format-list"></div>
        </div>

        <!-- Thumbnail Tab -->
        <div id="thumbnail" class="tab-content">
            <div class="input-group">
                <input type="text" id="thumbnail-url" placeholder="URL para ver a capa..." autocomplete="off">
            </div>
            <button class="action-btn" onclick="showThumbnail(this)">
                <div class="spinner"></div>
                <span>🖼️ Visualizar Capa</span>
            </button>

            <div class="thumbnail-container" style="display:none;" id="thumb-container">
                <img id="thumbnail-preview" alt="Thumbnail">
            </div>
        </div>

        <!-- Paraphraser Tab -->
        <div id="paraphrase" class="tab-content">
            <div class="input-group" style="display: flex; gap: 10px;">
                <select id="para-lang"
                    style="padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--glass-border);">
                    <option value="Português (Brasil)">Português (BR)</option>
                    <option value="Inglês">Inglês</option>
                    <option value="Espanhol">Espanhol</option>
                </select>
                <select id="para-model"
                    style="padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid var(--glass-border);">
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="gpt-4">GPT-4</option>
                    <option value="gpt-4o">GPT-4o</option>
                </select>
            </div>

            <textarea id="para-input" placeholder="Cole o texto original aqui..."
                style="width: 100%; height: 150px; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: white; margin-bottom: 20px; font-family: inherit; resize: vertical;"></textarea>

            <button class="action-btn" onclick="doParaphrase(this)"
                style="background: linear-gradient(135deg, #10b981, #059669);">
                <div class="spinner"></div>
                <span>📝 Parafrasear Texto</span>
            </button>

            <div class="result-box" id="para-output">Resultado aparecerá aqui...</div>
            <div style="margin-top: 10px; text-align: right;">
                <button class="action-btn secondary" style="width: auto; padding: 10px 20px;"
                    onclick="copyToClipboard('para-output')">Copiar</button>
            </div>
        </div>

        <!-- STR Generator Tab -->
        <div id="srt" class="tab-content">
            <textarea id="srt-input" placeholder="Cole o texto para transformar em legendas..."
                style="width: 100%; height: 150px; padding: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: white; margin-bottom: 20px; font-family: inherit; resize: vertical;"></textarea>

            <button class="action-btn" onclick="doGenerateSRT(this)"
                style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                <div class="spinner"></div>
                <span>🎬 Gerar Legenda SRT</span>
            </button>

            <div class="result-box" id="srt-output" style="font-family: monospace;">Resultado SRT aparecerá aqui...
            </div>
            <div style="margin-top: 10px; text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="action-btn secondary" style="width: auto; padding: 10px 20px;"
                    onclick="copyToClipboard('srt-output')">Copiar</button>
                <button class="action-btn secondary" style="width: auto; padding: 10px 20px; background: rgba(59, 130, 246, 0.2); border-color: #3b82f6;"
                    onclick="downloadSRT()">Baixar SRT</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Operação realizada com sucesso!</div>

    <script>
        // UI Interaction
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function switchFormatTab(panelId, btn) {
            document.querySelectorAll('.format-panel').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('panel-' + panelId).classList.add('active');
            btn.classList.add('active');
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = isError ? 'toast error show' : 'toast show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function setLoading(btn, isLoading) {
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // Logic
        async function transcribeVideo(btn) {
            const url = document.getElementById('transcribe-url').value;
            if (!url) { showToast("Cole uma URL primeiro!", true); return; }

            const titleBox = document.getElementById('video-title-box');
            titleBox.style.display = 'none';

            setLoading(btn, true);
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                if (data.title) {
                    document.getElementById('video-title').value = data.title;
                    titleBox.style.display = 'block';
                }
                document.getElementById('transcription-output').textContent = data.transcription;
                showToast("Transcrição concluída!");
            } catch (error) {
                showToast(error.message, true);
                document.getElementById('transcription-output').textContent = "Erro: " + error.message;
            } finally {
                setLoading(btn, false);
            }
        }

        // navigator.clipboard só existe em HTTPS/localhost; via IP em HTTP usa o fallback com execCommand
        async function writeClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('O navegador bloqueou a cópia');
        }

        async function copyTranscription() {
            const text = document.getElementById('transcription-output').textContent.trim();
            if (!text || text === 'Sua transcrição aparecerá aqui...' || text.startsWith('Erro: ')) {
                showToast("Nada para copiar!", true);
                return;
            }
            try {
                await writeClipboard(text);
                showToast("Transcrição copiada!");
            } catch (e) {
                showToast("Não foi possível copiar: " + e.message, true);
            }
        }

        async function copyTitle() {
            const text = document.getElementById('video-title').value.trim();
            if (!text) {
                showToast("Nada para copiar!", true);
                return;
            }
            try {
                await writeClipboard(text);
                showToast("Título copiado!");
            } catch (e) {
                showToast("Não foi possível copiar: " + e.message, true);
            }
        }

        async function listFormats(btn) {
            const url = document.getElementById('download-url').value;
            if (!url) { showToast("Cole uma URL primeiro!", true); return; }

            setLoading(btn, true);
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const container = document.getElementById('format-list');
                container.innerHTML = `
                    <div class="sub-tab-buttons">
                        <button class="sub-tab-btn active" onclick="switchFormatTab('va', this)">🎬 Vídeo + Áudio</button>
                        <button class="sub-tab-btn" onclick="switchFormatTab('vid', this)">📽️ Só Vídeo</button>
                        <button class="sub-tab-btn" onclick="switchFormatTab('aud', this)">🎧 Só Áudio</button>
                    </div>
                    <div id="panel-va" class="format-panel active"></div>
                    <div id="panel-vid" class="format-panel"></div>
                    <div id="panel-aud" class="format-panel"></div>
                `;

                const vaPanel  = document.getElementById('panel-va');
                const vidPanel = document.getElementById('panel-vid');
                const audPanel = document.getElementById('panel-aud');

                data.formats.forEach(f => {
                    if (f.type === 'video_audio') {
                        const el = document.createElement('div');
                        el.className = 'format-card';
                        el.innerHTML = `
                            <span>${f.ext.toUpperCase()} <span class="tag" style="background:rgba(16,185,129,0.2);color:#34d399">${f.resolution}</span> <span style="font-size:0.75em;opacity:0.6">${f.fps}fps</span></span>
                            <span style="font-size:0.9em;opacity:0.8">${f.size_mb}</span>
                        `;
                        el.onclick = () => downloadFile(url, f.format_id);
                        vaPanel.appendChild(el);

                    } else if (f.type === 'video') {
                        const el = document.createElement('div');
                        el.className = 'format-card';
                        el.innerHTML = `
                            <span>${f.ext.toUpperCase()} <span class="tag">${f.resolution}</span> <span style="font-size:0.75em;opacity:0.6">${f.fps}fps</span></span>
                            <span style="font-size:0.9em;opacity:0.8">${f.size_mb}</span>
                        `;
                        el.onclick = () => downloadFile(url, f.format_id);
                        vidPanel.appendChild(el);

                    } else {
                        const wrapper = document.createElement('div');
                        wrapper.style.cssText = 'display:flex;flex-direction:column;gap:5px;margin-bottom:5px';

                        const el = document.createElement('div');
                        el.className = 'format-card';
                        el.innerHTML = `
                            <span>${f.ext.toUpperCase()} <span class="tag">${f.bitrate}</span></span>
                            <span style="font-size:0.9em;opacity:0.8">${f.size_mb}</span>
                        `;
                        el.onclick = () => downloadFile(url, f.format_id);
                        wrapper.appendChild(el);

                        if (f.ext !== 'mp3') {
                            const mp3 = document.createElement('div');
                            mp3.className = 'format-card mp3-btn';
                            mp3.innerHTML = `<span>🎵 Converter para MP3</span>`;
                            mp3.onclick = () => downloadFile(url, f.format_id, true);
                            wrapper.appendChild(mp3);
                        }
                        audPanel.appendChild(wrapper);
                    }
                });

                // Abre a aba que tiver conteudo
                if (vaPanel.children.length === 0 && vidPanel.children.length > 0) {
                    switchFormatTab('vid', container.querySelector('[onclick*="vid"]'));
                }

            } catch (error) {
                showToast(error.message, true);
            } finally {
                setLoading(btn, false);
            }
        }

        function renderProgress({ stage, percent, speed, eta, indeterminate = false }) {
            document.getElementById('download-progress').classList.add('show');
            document.getElementById('progress-stage').textContent = stage || '';

            const bar = document.getElementById('progress-bar');
            const percentEl = document.getElementById('progress-percent');
            const meta = [speed, eta ? `faltam ${eta}` : ''].filter(Boolean).join(' · ');
            document.getElementById('progress-meta').textContent = meta;

            // Mux e conversão não reportam bytes: mostra a barra pulsando em vez de um número falso
            bar.classList.toggle('indeterminate', indeterminate);
            if (indeterminate) {
                percentEl.textContent = '';
            } else {
                const p = Math.max(0, Math.min(100, percent || 0));
                bar.style.width = p + '%';
                percentEl.textContent = p.toFixed(0) + '%';
            }
        }

        function hideProgress() {
            const panel = document.getElementById('download-progress');
            panel.classList.remove('show');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').classList.remove('indeterminate');
        }

        async function downloadFile(url, formatId, convertMp3 = false) {
            renderProgress({ stage: 'Preparando', percent: 0 });
            try {
                const formData = new FormData();
                formData.append('url', url);
                formData.append('format_id', formatId);
                formData.append('convert_to_mp3', convertMp3);

                const startRes = await fetch('/download_file', { method: 'POST', body: formData });
                const start = await startRes.json();
                if (!startRes.ok) throw new Error(start.error || "Erro no download");

                const jobId = start.job_id;
                let job;

                // Acompanha o progresso real do yt-dlp no servidor
                while (true) {
                    await new Promise(r => setTimeout(r, 500));

                    const res = await fetch(`/download_progress/${jobId}`);
                    job = await res.json();
                    if (!res.ok) throw new Error(job.error || "Progresso indisponível");

                    if (job.status === 'error') throw new Error(job.error || "Erro no download");
                    if (job.status === 'done') break;

                    renderProgress({
                        stage: job.stage,
                        percent: job.percent,
                        speed: job.speed,
                        eta: job.eta,
                        indeterminate: job.status === 'processing'
                    });
                }

                renderProgress({ stage: 'Concluído', percent: 100 });

                const a = document.createElement('a');
                a.href = `/download_result/${jobId}`;
                a.download = job.filename || `download_${Date.now()}.${convertMp3 ? 'mp3' : 'mp4'}`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                showToast("Download concluído!");
                setTimeout(hideProgress, 2000);
            } catch (e) {
                hideProgress();
                showToast("Erro: " + e.message, true);
            }
        }

        async function showThumbnail(btn) {
            const url = document.getElementById('thumbnail-url').value;
            if (!url) { showToast("Cole uma URL primeiro!", true); return; }

            setLoading(btn, true);
            try {
                const response = await fetch('/thumbnail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const container = document.getElementById('thumb-container');
                const img = document.getElementById('thumbnail-preview');
                img.src = data.thumbnail_url;
                container.style.display = 'block';
            } catch (error) {
                showToast(error.message, true);
            } finally {
                setLoading(btn, false);
            }
        }

        async function doParaphrase(btn) {
            const text = document.getElementById('para-input').value;
            const model = document.getElementById('para-model').value;
            const lang = document.getElementById('para-lang').value;

            if (!text) { showToast("Digite algum texto!", true); return; }

            setLoading(btn, true);
            try {
                const response = await fetch('/paraphrase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, model, language: lang })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('para-output').textContent = data.result;
                showToast("Texto parafraseado! ✨");
            } catch (e) {
                showToast(e.message, true);
            } finally {
                setLoading(btn, false);
            }
        }

        async function doGenerateSRT(btn) {
            const text = document.getElementById('srt-input').value;
            if (!text) { showToast("Digite algum texto!", true); return; }

            setLoading(btn, true);
            try {
                const response = await fetch('/generate_srt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('srt-output').textContent = data.result;
                showToast("Legendas geradas! 🎬");
            } catch (e) {
                showToast(e.message, true);
            } finally {
                setLoading(btn, false);
            }
        }

        async function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent.trim();
            if (!text) return;
            try {
                await writeClipboard(text);
                showToast("Copiado!");
            } catch (e) {
                showToast("Não foi possível copiar: " + e.message, true);
            }
        }

        function downloadSRT() {
            const text = document.getElementById('srt-output').textContent;
            if (!text || text === "Resultado SRT aparecerá aqui...") {
                showToast("Nenhuma legenda para baixar!", true);
                return;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'legenda.srt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Download iniciado!");
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW não registrado:', err));
            });
        }
    </script>
